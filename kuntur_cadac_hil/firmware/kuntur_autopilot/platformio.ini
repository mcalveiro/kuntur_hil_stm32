; platformio.ini -- firmware del autopiloto FALCON6 en STM32F767.
; Ver plan-hil-stm32-portado-autopiloto.md §7/§15.
;
; framework=stm32cube: acceso directo a HAL + middleware USB CDC ya
; portado (setup = incluir el middleware y configurar el descriptor,
; no es trabajo pesado -- ver §7 del plan). Sin RTOS.

[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; src/test_target/ y src/hil/ tienen cada uno su propio main() (ver
; envs de abajo) -- se excluyen del build por default para no chocar
; con src/main.c (blink). src/usb/ tampoco hace falta acá (solo lo usa
; el env _hil).
build_src_filter =
    +<*>
    -<test_target/>
    -<hil/>
    -<usb/>

; El firmware de fábrica del Nucleo deja al STM32F767 en un estado que
; no responde en el puerto de depuración SWD con una conexión normal
; (OpenOCD se cuelga en SWD_DP_WAIT) -- hace falta conectar con el
; target en reset (srst) para que el Debug Port quede accesible.
; Verificado a mano con openocd antes de fijar esto acá.
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
debug_init_break =

; FPU hardware (FPv5-D16) ya viene por default del framework para esta
; board. El reloj a 216MHz + I/D-cache explícitos (Fase 4 del plan) los
; configura src/bsp/clock_config.c -- este env (blink) sigue sin
; tocarlos a propósito (ver comentario de src/main.c).
build_flags =
    -Wall
    -Wextra

; env:nucleo_f767zi_bitexact -- Fase 4 del plan (testbench Nivel 0
; cross-compilado para el target real, reporte por UART). Mismo board/
; framework/upload que el env de arriba; solo cambia qué main() se
; linkea (ver src/test_target/main_bitexact.c).
[env:nucleo_f767zi_bitexact]
extends = env:nucleo_f767zi
build_src_filter =
    +<*>
    -<main.c>
    -<hil/>
    -<usb/>

; env:nucleo_f767zi_hil -- Fase 5/6 del plan (USB CDC real, loop del
; autopiloto a 100Hz contra kuntur_bridge/stm32_bridge.py). Única que
; compila src/usb/ (middleware CDC vendoreado + glue propio).
[env:nucleo_f767zi_hil]
extends = env:nucleo_f767zi
build_src_filter =
    +<*>
    -<main.c>
    -<test_target/>
; el middleware vendoreado (src/usb/middleware/) hace #include "usbd_conf.h"
; (sin ruta, patrón estándar de ST) esperando encontrar NUESTRO
; usbd_conf.h -- vive un nivel arriba (src/usb/), hace falta agregarlo
; al include path a mano (el único -I que agrega PlatformIO por
; default es el de la raíz de src/).
build_flags =
    ${env:nucleo_f767zi.build_flags}
    -Isrc/usb
    -Isrc/usb/middleware/Core/Inc
    -Isrc/usb/middleware/Class/CDC/Inc
; los .c vendoreados (src/usb/middleware/.../Src/*.c) hacen #include
; "usbd_cdc.h" / "usbd_core.h" sin ruta -- resuelve porque viven junto
; a sus .h en el proyecto ORIGINAL de ST (todo en un mismo directorio
; "Inc"+"Src" plano); acá quedaron separados en Inc/ vs Src/ al
; vendorear (ver src/usb/middleware/README.md), así que hace falta el
; -I explícito a cada Inc/.
;
; sin esto, la Library Dependency Finder de PlatformIO detecta el
; propio STM32_USB_Device_Library que trae empaquetado
; framework-stm32cubef7 (lo expone como libreria instalable) y lo
; compila EN PARALELO a nuestra copia vendoreada en src/usb/middleware/
; -- mismos simbolos definidos dos veces, error de link. Esta copia
; vendoreada + build_src_filter ya deciden que se compila.
lib_ldf_mode = off
